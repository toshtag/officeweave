# 開発用の構成。
#
# 配布用（compose.production.yaml）とは、project 名もデータボリュームも分ける。
# 同じ名前を使うと、開発用の `docker compose down -v` が
# 配布用として運用しているデータベースを削除し得る。
#
# 使い方:
#   docker compose up -d --build
name: officeweave_development

# web と worker は同じ設定で動く。
x-application-environment: &application_environment
  DATABASE_HOST: db
  DATABASE_USER: ${DATABASE_USER:-officeweave}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-officeweave_development}
  DATABASE_NAME: ${DATABASE_NAME:-officeweave_development}
  QUEUE_DATABASE_NAME: ${QUEUE_DATABASE_NAME:-officeweave_development_queue}
  QUEUE_DATABASE_CONNECTIONS: ${QUEUE_DATABASE_CONNECTIONS:-5}
  JOB_THREADS: ${JOB_THREADS:-2}
  JOB_PROCESSES: ${JOB_PROCESSES:-1}
  RAILS_ENV: ${RAILS_ENV:-development}
  # 初期利用者と組織の設定（INITIAL_USER_*、ORGANIZATION_*）はここへ置かない。
  # 使うのは bin/rails db:seed だけで、web と worker の通常の実行には要らない。
  # 常駐するコンテナへ渡すと、初期管理者の平文パスワードがその寿命のあいだ
  # 環境に残り続ける。.env から消しても、作成済みのコンテナからは消えない。
  # script/seed_initial_user が、一時コンテナへ変数名だけを指定して渡す。
  #
  # 認証方式。未設定の場合だけ内部認証を使う。
  # 空文字は既定値へ置き換えず、そのまま渡す。設定の誤りは起動時に拒否する。
  AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER-internal}
  # メール本文などの URL は、実際に公開しているポートで組み立てる。
  WEB_PORT: ${WEB_PORT:-3210}

services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${DATABASE_USER:-officeweave}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-officeweave_development}
      POSTGRES_DB: ${DATABASE_NAME:-officeweave_development}
    volumes:
      - development_db_data:/var/lib/postgresql
    # ホストへは公開しない。web からは db:5432 で到達できる。
    # ホストの DB クライアントから直接つなぐ場合だけ、compose.database.yaml を重ねる。
    healthcheck:
      # web の起動前にデータベースが接続を受け付けていることを保証する。
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-officeweave}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        RUBY_VERSION: "4.0.6"
    environment:
      <<: *application_environment
    volumes:
      # ソースコードだけを共有する。gem はイメージ内に置き、
      # 名前付きボリュームで /usr/local/bundle を覆わない。
      # Gemfile を変更した場合は docker compose build を実行する。
      - .:/app
    healthcheck:
      # データベースの準備は web の起動処理が行う。
      # worker はその完了を待つため、web の稼働をここで判定できるようにする。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      # 既定では loopback にだけ公開する。
      # 同じ端末で他の開発環境が動いていても衝突しにくい値を選ぶ。
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3210}:3000"
    depends_on:
      db:
        condition: service_healthy

  # メールと Webhook の送信を実際に行う。
  #
  # 運用環境と同じ方式で動かす。実行方式が違うと、
  # キューに関わる不具合が手元で再現しない。
  # 画面を提供しないため、ホストへポートを公開しない。
  worker:
    build:
      context: .
      args:
        RUBY_VERSION: "4.0.6"
    command: bin/jobs
    stop_grace_period: 30s
    environment:
      <<: *application_environment
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "bin/jobs_alive"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy

volumes:
  development_db_data:
