# 開発用の構成。
#
# 配布用（compose.production.yaml）とは、project 名もデータボリュームも分ける。
# 同じ名前を使うと、開発用の `docker compose down -v` が
# 配布用として運用しているデータベースを削除し得る。
#
# 使い方:
#   docker compose up -d --build
name: officeweave_development

services:
  db:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${DATABASE_USER:-officeweave}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-officeweave_development}
      POSTGRES_DB: ${DATABASE_NAME:-officeweave_development}
    volumes:
      - development_db_data:/var/lib/postgresql
    # ホストへは公開しない。web からは db:5432 で到達できる。
    # ホストの DB クライアントから直接つなぐ場合だけ、compose.database.yaml を重ねる。
    healthcheck:
      # web の起動前にデータベースが接続を受け付けていることを保証する。
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-officeweave}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        RUBY_VERSION: "3.4.10"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER:-officeweave}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-officeweave_development}
      DATABASE_NAME: ${DATABASE_NAME:-officeweave_development}
      RAILS_ENV: ${RAILS_ENV:-development}
      # メール本文などの URL は、実際に公開しているポートで組み立てる。
      WEB_PORT: ${WEB_PORT:-3210}
    volumes:
      # ソースコードだけを共有する。gem はイメージ内に置き、
      # 名前付きボリュームで /usr/local/bundle を覆わない。
      # Gemfile を変更した場合は docker compose build を実行する。
      - .:/app
    ports:
      # 既定では loopback にだけ公開する。
      # 同じ端末で他の開発環境が動いていても衝突しにくい値を選ぶ。
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3210}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  development_db_data:
