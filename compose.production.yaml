# 配布用の構成。
#
# 開発用（compose.yaml）とは別に用意する。
# 開発用はソースコードをホストから共有するため、配布には使えない。
#
# project 名とデータボリュームは開発用と分ける。
# 同じ名前を使うと、開発用の `docker compose down -v` が
# ここで運用しているデータベースを削除し得る。
#
# この構成を扱うコマンドには、必ず -f compose.production.yaml を付ける。
# 付け忘れると開発用の構成に対して実行される。
#
# 使い方:
#   docker compose -f compose.production.yaml up -d --build
name: officeweave_production

services:
  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER を設定してください}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD を設定してください}
      POSTGRES_DB: ${DATABASE_NAME:-officeweave_production}
    volumes:
      - production_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      DATABASE_HOST: db
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER を設定してください}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD を設定してください}
      DATABASE_NAME: ${DATABASE_NAME:-officeweave_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE を設定してください}
      APPLICATION_HOST: ${APPLICATION_HOST:-localhost}
      APPLICATION_PROTOCOL: ${APPLICATION_PROTOCOL:-https}
      MAIL_FROM: ${MAIL_FROM:-officeweave@localhost}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER_NAME: ${SMTP_USER_NAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTHENTICATION: ${SMTP_AUTHENTICATION:-}
      SMTP_ENABLE_STARTTLS: ${SMTP_ENABLE_STARTTLS:-true}
      INITIAL_USER_NAME: ${INITIAL_USER_NAME:-}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-OfficeWeave}
      ORGANIZATION_CODE: ${ORGANIZATION_CODE:-default}
      AUTHENTICATION_PROVIDER: ${AUTHENTICATION_PROVIDER:-internal}
      WEBHOOK_PRIVATE_DESTINATION_ALLOWLIST: ${WEBHOOK_PRIVATE_DESTINATION_ALLOWLIST:-}
      FORCE_SSL: ${FORCE_SSL:-true}
      # メール本文などの URL は、実際に公開しているポートで組み立てる。
      WEB_PORT: ${WEB_PORT:-3210}
    volumes:
      # アップロードされたファイルは、入れ替えても失われないようにする。
      - production_storage_data:/app/storage
    ports:
      # 既定では loopback にだけ公開する。逆プロキシの背後へ置く構成を前提とする。
      # 逆プロキシを使わず外部へ直接公開する場合に限り、
      # WEB_BIND_ADDRESS=0.0.0.0 を利用者が明示する。
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3210}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  production_db_data:
  production_storage_data:
