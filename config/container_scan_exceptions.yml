# 配布用のイメージの検査で、確認したうえで非該当と判断した指摘。
#
# ここへ書くのは、抑止ではなく記録である。書いた指摘も報告には残り、
# 検査の出力にも「記録として通した」ものとして並ぶ。見せないための場所ではない。
#
# 書いてよいのは、次のどちらも成り立つ場合に限る。
#
#   1. この製品が影響を受ける経路が無い、と根拠を示して言える
#   2. 自分たちで解消できない。言語処理系が同梱するものなど、版を選べない
#
# 版を必ず書く。指摘は入っている版に対して出る。版が上がれば、その指摘が
# 同じ意味を持つとは限らない。書いた版と違えば、記録は当たらず検査は失敗する。
#
# 期限も必ず書く。過ぎた記録は当たらず、検査は失敗する。恒久的な除外を作らない。
# 判断は、そのときの状況に対して行ったものである。
#
# 依存の監査（config/bundler-audit.yml）と役割は同じだが、対象が違う。
# あちらは Gemfile.lock、こちらは配布するイメージへ入っているものを見る。

