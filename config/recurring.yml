# 定期実行の登録。
#
# 登録してよいのは次の 2 つだけとする。運用の都合で動く処理が増えるほど、
# どの時刻に何が動くのかを追えなくなる。
#
#   1. 放置すると記録が溜まり続ける後始末
#   2. 時刻の到来だけで成立し、誰の操作も待てない状態の変更
#
# 2 は、利用者の操作を契機にできる処理を含まない。画面から呼べる処理を
# ここへ移すと、実行の理由が時刻に置き換わり、追跡できなくなる。
#
# 実行する分は互いにずらす。同じ分に重ねると、片方の遅れが
# もう片方の実行時刻へそのまま出る。
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  delete_expired_sessions:
    command: "Session.delete_expired"
    schedule: every hour at minute 22
  # 保持期間を指定していない場合は 1 件も対象にならない。
  # 毎時ではなく 1 日 1 回とする。日の単位で判断する設定であり、
  # 蓄積した記録を毎時走査する理由がない。
  delete_expired_audit_events:
    command: "AuditEvent.delete_expired"
    schedule: every day at 3:32am
  # 期限を過ぎた数え上げの行。次の要求が来る key は自分で置き換わるため、
  # 残るのは二度と来ない接続元や token のぶんだけである。
  delete_expired_rate_limit_counters:
    command: "RateLimitCounter.delete_expired"
    schedule: every hour at minute 42
  # 画面へ出す通知。指定した場合だけ、その日数より古いものを消す。
  # 監査記録と同じく 1 日 1 回とする。日の単位で判断する設定である。
  delete_expired_notifications:
    command: "Notification.delete_expired"
    schedule: every day at 3:42am
  # 外部への送信の記録。試行ごとに増える。
  delete_expired_webhook_deliveries:
    command: "WebhookDelivery.delete_expired"
    schedule: every day at 3:52am
  # 運用の異常を知らせた記録。知らせ直す判断に使うのは直近の 1 件だけで、
  # それより古いものは運用の履歴としてだけ残る。
  delete_expired_operational_alerts:
    command: "OperationalAlert.delete_expired"
    schedule: every day at 4:02am
  # 放っておくと運用が成り立たなくなるものを、1 日 1 回だけ知らせる。
  # 宛先を設定していない場合と、異常が無い場合は何も送らない。
  report_operational_issues:
    class: ReportOperationalIssuesJob
    schedule: every day at 7:42am
  # 公開日時の到来で公開が成立する。誰の操作も待てないため、ここで拾う。
  # 到来から知らせまでの遅れが 1 時間になると、予約公開の意味が薄れる。
  publish_scheduled_announcements:
    class: PublishScheduledAnnouncementsJob
    schedule: every 5 minutes
