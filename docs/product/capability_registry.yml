      - "test/controllers/reservation_change_test.rb"
      - "test/models/reservation_test.rb"
      - "test/system/reservations_test.rb"
    docs:
      - "docs/operations/administration.md"
      - "docs/usage/events_and_reservations.md"
    criteria:
      authorization:
        result: "met"
        reason: "参照と更新の入口は既定で認証を要し、開く入口だけが理由とともに宣言する。組織は認証した利用者から決まり、要求の値からは決まらない。"
        evidence:
          - "test/configuration/authentication_coverage_test.rb"
      audit_assignment:
        result: "met"
        reason: "予約自身が誰のものかを持つため、記録しないことを理由とともに宣言する。"
        evidence:
          - "test/configuration/audit_assignment_test.rb"
      notification_occurrence:
        result: "not_applicable"
        reason: "通知を伴う出来事を持たない。"
        evidence: []
      list_limit:
        result: "met"
        reason: "指定できる期間を持ち、期間の長さにも上限がある。期間の内側でもページ送りを持つ。"
        evidence:
          - "test/models/date_window_test.rb"
          - "test/controllers/list_query_count_test.rb"
      selection_rendering:
        result: "met"
        reason: "設備を選ぶ欄は上限を置き、絞り込みで残りへ到達できる。"
        evidence:
          - "test/models/candidates_test.rb"
      database_invariants:
        result: "met"
        reason: "同じ設備の時間帯が重ならないことは `reservations_must_not_overlap` が保つ。判定は状態コードと制約の名前で行い、例外の文面に依存しない。"
        evidence:
          - "test/models/reservation_test.rb"
          - "app/models/database_constraint.rb"
      retention:
        result: "not_applicable"
        reason: "人の判断で足す記録であり、時間で増え続けない。"
        evidence: []
      regression_tests:
        result: "met"
        reason: "入口を通るテストを挙げてある。挙げただけで入口を開かない状態は検査が落とす。"
        evidence:
          - "test/configuration/regression_coverage_test.rb"
      documentation:
        result: "met"
        reason: "予約の手順、重なりの扱い、直せる範囲を書いた。"
        evidence:
          - "docs/usage/events_and_reservations.md"
      localization:
        result: "met"
        reason: "画面へ語句を直接書かず、ロケールファイルを経由する。2 つの言語の鍵がそろうことは別の検査が保証する。"
        evidence:
          - "test/configuration/user_facing_text_test.rb"
          - "test/configuration/locale_symmetry_test.rb"
      keyboard:
        result: "met"
        reason: "主要な操作を、Tab / Shift+Tab / Enter / Space / 文字の入力だけで完遂する。要素を直接指して押す呼び出しは使わない。押せない要素へ操作を載せる形は、静的な検査が補助として落とす。"
