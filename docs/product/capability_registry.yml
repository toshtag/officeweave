# OfficeWeave 機能到達度（機械が読む正本）
#
# 文章の正本は docs/product/capability_matrix.md である。この一覧は同じ内容を
# 機械が読める形で持ち、件数・識別子・状態・入口・証拠・条件の判定を検査へかける。
# 両方を人が別々に直すと必ず食い違うため、test/configuration/completion_registry_test.rb
# が突き合わせる。
#
# 条件の判定は met / unmet / not_applicable / not_assessed の 4 つとする。
# partial の機能では、確かめていない条件を not_assessed のまま残す。満たしている
# ことにしない。complete にできるのは、unmet と not_assessed が 1 つも無い場合だけ。
completion:
  core_capabilities: 26
  cross_cutting_gates: 2
  release_gate: "release.production_readiness"
  definition: "Core 26 件が complete、横断の品質 2 件が complete、版ごとの評価が passed であること"
capabilities:
  - id: "core.authentication"
    name: "ログインとセッション"
    kind: "capability"
    state: "partial"
    entries:
      - "/session"
    implementation:
      - "config/recurring.yml"
    implementation_note: "Session, User, Authentication::*, config/recurring.yml（毎時 Session.delete_expired）"
    tests:
      - "test/configuration/persistent_queue_test.rb"
      - "test/controllers/session_activity_test.rb"
      - "test/controllers/sessions_controller_test.rb"
      - "test/models/session_test.rb"
      - "test/system/authentication_test.rb"
    docs:
      - "docs/operations/administration.md"
      - "docs/operations/configuration.md"
    criteria:
      authorization:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      audit_assignment:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      notification_occurrence:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      list_limit:
