# OfficeWeave 機能到達度（正本）
#
# 段階、状態、入口、実装、検証、文書、条件の判定は、すべてここが持つ。
# 読み方は docs/product/capability_matrix.md にある。同じ内容を散文でも持つと、
# 片方だけを直した変更が必ず出る。
#
# 条件の判定は met / unmet / not_applicable / not_assessed の 4 つとする。
# partial の機能では、確かめていない条件を not_assessed のまま残す。満たしている
# ことにしない。complete にできるのは、unmet と not_assessed が 1 つも無い場合だけ。
completion:
  release_gate: "release.production_readiness"
  definition: "stage が core の機能がすべて complete、横断の品質がすべて complete、版ごとの評価が passed であること"
capabilities:
  - id: "core.authentication"
    name: "ログインとセッション"
    kind: "capability"
    state: "complete"
    entries:
      - "/session"
    implementation:
      - "config/recurring.yml"
    implementation_note: "Session, User, Authentication::*, RateLimitCounter, config/recurring.yml（毎時 Session.delete_expired）"
    tests:
      - "test/configuration/persistent_queue_test.rb"
      - "test/controllers/session_activity_test.rb"
      - "test/controllers/sessions_controller_test.rb"
      - "test/models/session_test.rb"
      - "test/system/authentication_test.rb"
    docs:
      - "docs/operations/administration.md"
      - "docs/operations/configuration.md"
      - "docs/usage/getting_started.md"
    criteria:
      authorization:
        result: "met"
        reason: "参照と更新の入口は `ApplicationController` の既定で認証を要し、ログインの入口だけが `allow_unauthenticated_access` で開く。組織はログインした利用者から決まり、要求の値からは決まらない。"
        evidence:
          - "test/controllers/sessions_controller_test.rb"
          - "test/controllers/screen_rate_limit_test.rb"
      audit_assignment:
        result: "met"
        reason: "`create` と `destroy` を `records_audit` で宣言し、成功と失敗の両方を記録へ残す。"
        evidence:
          - "test/configuration/audit_assignment_test.rb"
          - "test/controllers/sessions_controller_test.rb"
      notification_occurrence:
        result: "not_applicable"
        reason: "通知を伴う出来事を持たない。"
        evidence: []
      list_limit:
        result: "not_applicable"
        reason: "蓄積する一覧を持たない。"
        evidence: []
      selection_rendering:
        result: "not_applicable"
        reason: "利用者・部門・設備を選ばせる欄を持たない。"
        evidence: []
      database_invariants:
        result: "met"
        reason: "`sessions` は利用者への参照を外部キーで持ち、期限の判定は行の値だけで決まる。試行の数え上げは `rate_limit_counters` の一意の索引の上で 1 文の加算として行う。"
        evidence:
          - "test/models/rate_limit_counter_concurrency_test.rb"
      retention:
        result: "met"
        reason: "期限を過ぎたログインは `Session.delete_expired` が毎時消し、試行の数え上げは `RateLimitCounter.delete_expired` が毎時消す。"
        evidence:
          - "test/models/rate_limit_counter_test.rb"
      regression_tests:
        result: "met"
        reason: "入口、実装、試行の上限、期限切れの後始末に、退行を止めるテストがある。"
        evidence:
          - "test/controllers/sessions_controller_test.rb"
          - "test/controllers/screen_rate_limit_test.rb"
          - "test/models/session_test.rb"
          - "test/models/rate_limit_counter_concurrency_test.rb"
      documentation:
        result: "met"
        reason: "ログイン、失敗したときの扱い、外部の認証基盤を使う場合の違いを利用者向けに書いた。"
        evidence:
          - "docs/usage/getting_started.md"
      localization:
        result: "met"
        reason: "画面へ語句を直接書かず、ロケールファイルを経由する。2 つの言語の鍵がそろうことは別の検査が保証する。"
        evidence:
          - "test/configuration/user_facing_text_test.rb"
          - "test/configuration/locale_symmetry_test.rb"
      keyboard:
        result: "met"
        reason: "主要な操作を、Tab / Shift+Tab / Enter / Space / 文字の入力だけで完遂する。要素を直接指して押す呼び出しは使わない。押せない要素へ操作を載せる形は、静的な検査が補助として落とす。"
        evidence:
          - "docs/product/keyboard_flows.yml"
          - "test/browser/keyboard_flows_test.rb"
          - "test/configuration/keyboard_flow_coverage_test.rb"
          - "test/configuration/keyboard_operability_test.rb"
    other_findings: []
    issue: "C1"
    dependencies: []
    stage: "core"
