        reason: "評価していない"
        evidence: []
      selection_rendering:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      database_invariants:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      retention:
        result: "met"
        reason: "期限を過ぎた記録は `Session.delete_expired` （`app/models/session.rb:35`）が毎時消す。"
        evidence: []
      regression_tests:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      documentation:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      localization:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      keyboard:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
    other_findings:
      - "試行の上限が、動かしている web の数に依存する。 `app/controllers/sessions_controller.rb:6` の上限はキャッシュ領域で数えるが、 配布用の設定は共有の置き場を持たない（`config/environments/production.rb:57`）。 web を増やすと、その数だけ上限が実質的に増える"
