# OfficeWeave 機能到達度（機械が読む正本）
#
# 文章の正本は docs/product/capability_matrix.md である。この一覧は同じ内容を
# 機械が読める形で持ち、件数・識別子・状態・入口・証拠・条件の判定を検査へかける。
# 両方を人が別々に直すと必ず食い違うため、test/configuration/completion_registry_test.rb
# が突き合わせる。
#
# 条件の判定は met / unmet / not_applicable / not_assessed の 4 つとする。
# partial の機能では、確かめていない条件を not_assessed のまま残す。満たしている
# ことにしない。complete にできるのは、unmet と not_assessed が 1 つも無い場合だけ。
completion:
  core_capabilities: 26
  cross_cutting_gates: 2
  release_gate: "release.production_readiness"
  definition: "Core 26 件が complete、横断の品質 2 件が complete、版ごとの評価が passed であること"
capabilities:
  - id: "core.authentication"
    name: "ログインとセッション"
    kind: "capability"
    state: "partial"
    entries:
      - "/session"
    implementation:
      - "config/recurring.yml"
    implementation_note: "Session, User, Authentication::*, RateLimitCounter, config/recurring.yml（毎時 Session.delete_expired）"
    tests:
      - "test/configuration/persistent_queue_test.rb"
      - "test/controllers/session_activity_test.rb"
      - "test/controllers/sessions_controller_test.rb"
      - "test/models/session_test.rb"
      - "test/system/authentication_test.rb"
    docs:
      - "docs/operations/administration.md"
      - "docs/operations/configuration.md"
    criteria:
      authorization:
        result: "met"
        reason: "参照と更新の入口は `ApplicationController` の既定で認証を要し、ログインの入口だけが `allow_unauthenticated_access` で開く。組織はログインした利用者から決まり、要求の値からは決まらない。"
        evidence:
          - "test/controllers/sessions_controller_test.rb"
          - "test/controllers/screen_rate_limit_test.rb"
      audit_assignment:
        result: "met"
        reason: "`create` と `destroy` を `records_audit` で宣言し、成功と失敗の両方を記録へ残す。"
        evidence:
          - "test/configuration/audit_assignment_test.rb"
          - "test/controllers/sessions_controller_test.rb"
      notification_occurrence:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      list_limit:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      selection_rendering:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      database_invariants:
        result: "met"
        reason: "`sessions` は利用者への参照を外部キーで持ち、期限の判定は行の値だけで決まる。試行の数え上げは `rate_limit_counters` の一意の索引の上で 1 文の加算として行う。"
        evidence:
          - "test/models/rate_limit_counter_concurrency_test.rb"
      retention:
        result: "met"
        reason: "期限を過ぎた記録は `Session.delete_expired` （`app/models/session.rb:35`）が毎時消す。"
        evidence: []
      regression_tests:
        result: "met"
        reason: "入口、実装、試行の上限、期限切れの後始末に、退行を止めるテストがある。"
        evidence:
          - "test/controllers/sessions_controller_test.rb"
          - "test/controllers/screen_rate_limit_test.rb"
          - "test/models/session_test.rb"
          - "test/models/rate_limit_counter_concurrency_test.rb"
      documentation:
        result: "unmet"
        reason: "運用の設定は文書にあるが、利用者がログインし、端末を確認して終わらせる手順の文書が無い。C5 が持つ。"
        evidence:
          - "docs/operations/configuration.md"
      localization:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
      keyboard:
        result: "not_assessed"
        reason: "評価していない"
        evidence: []
    other_findings: []
    issue: "C1"
    dependencies: []
    stage: "core"
