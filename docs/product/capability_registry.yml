      localization:
        result: "met"
        reason: "画面へ語句を直接書かず、ロケールファイルを経由する。2 つの言語の鍵がそろうことは別の検査が保証する。"
        evidence:
          - "test/configuration/user_facing_text_test.rb"
          - "test/configuration/locale_symmetry_test.rb"
      keyboard:
        result: "met"
        reason: "主要な操作を、Tab / Shift+Tab / Enter / Space / 文字の入力だけで完遂する。要素を直接指して押す呼び出しは使わない。押せない要素へ操作を載せる形は、静的な検査が補助として落とす。"
