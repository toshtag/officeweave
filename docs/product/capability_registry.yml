          - "test/configuration/keyboard_flow_coverage_test.rb"
          - "test/configuration/keyboard_operability_test.rb"
    other_findings:
      - "実際の認証基盤へ接続した状態での確認が無い"
    issue: "C1"
    dependencies: []
    stage: "core"
