        evidence:
          - "test/models/candidates_test.rb"
      database_invariants:
        result: "met"
        reason: "様式の識別子と、承認の段の位置の一意は索引が保つ。状態の変化は行を占有したうえで決めるため、同時の決裁でも段が 2 つ進まない。"
        evidence:
          - "test/models/request_concurrency_test.rb"
      retention:
        result: "not_applicable"
        reason: "人の判断で足す記録であり、時間で増え続けない。"
        evidence: []
      regression_tests:
        result: "met"
        reason: "権限、段の進み方、競合、委任の届く範囲にテストがある。"
        evidence:
          - "test/models/request_concurrency_test.rb"
