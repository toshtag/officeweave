# 画面を持つ Core ごとの、主要な操作。
#
# 共通条件 `keyboard`「主要な操作がキーボードだけで完了する」の対象を定義する。
# ここへ挙げた操作は、test/browser/keyboard_flows_test.rb が
# Tab / Shift+Tab / Enter / Space / 文字の入力だけで完遂する。
#
# 「主要な操作」は、その機能を使う人がそれを開く理由になる操作とする。
# 一覧を見るだけの機能は、見る操作そのものが主要な操作である。
#
# 対応の漏れは test/configuration/keyboard_flow_coverage_test.rb が落とす。
flows:
  - capability: "core.authentication"
    name: "ログインする"
    test: "キーボードだけでログインする"
  - capability: "core.external_authentication"
    name: "認可サーバーへ送り出す入口を開く"
    test: "キーボードだけで外部の認証へ進む"
  - capability: "core.password_management"
    name: "パスワードを変更する"
    test: "キーボードだけでパスワードを変える"
  - capability: "core.session_listing"
    name: "ログイン中の端末を終わらせる"
    test: "キーボードだけで端末を終わらせる"
  - capability: "core.personal_settings"
    name: "表示する言語を変える"
    test: "キーボードだけで自分の設定を保存する"
  - capability: "core.user_administration"
    name: "利用者を追加する"
    test: "キーボードだけで利用者を追加する"
  - capability: "core.departments"
    name: "部門を作る"
    test: "キーボードだけで部門を作る"
  - capability: "core.data_transfer"
    name: "利用者を書き出す"
    test: "キーボードだけで書き出しを始める"
  - capability: "core.home"
    name: "入口から各機能へ移る"
    test: "キーボードだけで入口から移動する"
  - capability: "core.announcements"
    name: "お知らせを書いて公開する"
    test: "キーボードだけでお知らせを公開する"
  - capability: "core.events"
    name: "予定を作る"
    test: "キーボードだけで予定を作る"
  - capability: "core.resources"
    name: "設備・備品を作る"
    test: "キーボードだけで設備を作る"
  - capability: "core.reservations"
    name: "設備を予約する"
    test: "キーボードだけで予約する"
  - capability: "core.requests"
    name: "申請を作って提出する"
    test: "キーボードだけで申請を提出する"
  - capability: "core.approval_delegation"
    name: "承認を委任する"
    test: "キーボードだけで承認を委任する"
  - capability: "core.documents"
    name: "文書を書く"
    test: "キーボードだけで文書を作る"
  - capability: "core.notifications"
    name: "通知の一覧を開く"
    test: "キーボードだけで通知を開く"
  - capability: "core.audit"
    name: "監査記録を絞り込む"
    test: "キーボードだけで監査記録を絞り込む"
  - capability: "core.public_api"
    name: "外部接続の token を発行する"
    test: "キーボードだけで token を発行する"
  - capability: "core.webhooks"
    name: "出来事の送信先を登録する"
    test: "キーボードだけで送信先を登録する"
  - capability: "core.localization"
    name: "画面の表示言語を切り替える"
    test: "キーボードだけで表示言語を切り替える"
