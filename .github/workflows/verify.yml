name: 検証

# 手元と同じ手順を実行する。
# 検証の内容は bin/verify に定義してあり、ここでは呼び出すだけにする。
# 手順をここへ書き写すと、手元と自動実行で結果が食い違う。
#
# 速く返すため、範囲を分けて同時に走らせる。渡すのは範囲の名前だけとし、
# どのコマンドを流すかは bin/verify が決める。
#
# ここに置くのは、変更を出すたびに走らせるものだけとする。判断は
# 「この変更で壊れ得るか」で行う。壊れ得ないものを毎回走らせると、
# 待ち時間だけが増え、やがて結果を見ずにマージする習慣がつく。
#
# 配布用の構成、バックアップ、永続キュー、実ブラウザー、イメージの脆弱性は
# operations.yml へ置く。いずれも起動と後片付けを含んで 2 分前後かかり、
# 見ているのは配布用の構成とホスト側の手順である。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    name: 構成の分離
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ソースを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 分離の条件を検査する
        run: script/check_compose_isolation

  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 範囲を分けて同時に走らせる。ここに並べるのは範囲の名前だけとし、
    # 手順は持たせない。手順を写すと、config/verify.rb へ検査を足しても
    # 自動実行がそれを流さない状態が黙って生まれる。
    #
    # 範囲がすべて挙がっていることは
    # test/configuration/verification_scope_test.rb が確かめる。
    strategy:
      # 1 つが落ちても残りを最後まで走らせる。落ちた範囲だけを見て直せる。
      fail-fast: false
      matrix:
        include:
          - { name: 書式とセキュリティ, scope: checks, shard: "" }
          - { name: テスト 1/3, scope: tests, shard: 1/3 }
          - { name: テスト 2/3, scope: tests, shard: 2/3 }
          - { name: テスト 3/3, scope: tests, shard: 3/3 }

    # 同じホストで複数の検証が並行しうる。
    # 構成ファイルの name をそのまま使うと、互いのコンテナとボリュームを掴む。
    env:
      COMPOSE_PROJECT_NAME: officeweave_ci_${{ github.run_id }}_${{ strategy.job-index }}

    steps:
      - name: ソースを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 組み立ての道具を用意する
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 組み立てた層を実行の間で持ち越す。
      #
      # 依存の解決は、依存の定義が変わらなければ毎回同じ結果になる。
      # 実行のたびにやり直すと、その待ち時間が変更を出した人へそのまま乗る。
      #
      # 名前は compose が使うものへそろえる。食い違うと、この手順で組み立てた
      # ものが使われず、compose が改めて組み立て直す。
      - name: 実行環境を組み立てる
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.COMPOSE_PROJECT_NAME }}:development
          load: true
          cache-from: type=gha,scope=development
          cache-to: type=gha,scope=development,mode=max

      # 脆弱性の一覧を実行の間で持ち越す。取り直すと 20 秒から 27 秒かかる。
      #
      # 鍵は実行ごとに変え、直前のものを土台にする。同じ鍵では書き換えられず、
      # 最初に取得した内容が残り続ける。中身の更新は bin/verify が行う。
      #
      # 使うのは監査を含む範囲だけとする。他の範囲からも同じ鍵へ書くと、
      # 同時に書き込んで先に終わった側の内容が捨てられる。
      - name: 脆弱性の一覧を持ち越す
        if: matrix.scope == 'checks'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/ruby-advisory-db
          key: ruby-advisory-db-${{ github.run_id }}
          restore-keys: ruby-advisory-db-

      - name: データベースを起動する
        run: docker compose up -d db

      # 一覧の置き場所を作業ディレクトリへ移す。既定の置き場所はコンテナの
      # 中にあり、実行のたびに捨てられる。
      #
      # 書き戻すのは実行環境の利用者、読むのはコンテナの中の root であり、
      # 持ち主が食い違う。git はこれを拒むため、この 1 か所だけ例外にする。
      # 全体を例外にはしない。緩める範囲は持ち越した一覧に限る。
      - name: 検証を実行する
        env:
          SCOPE: ${{ matrix.scope }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          docker compose run --rm \
            -e BUNDLER_AUDIT_DB=/app/tmp/ruby-advisory-db \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/app/tmp/ruby-advisory-db \
            -e TEST_SHARD \
            web bin/verify "${SCOPE}"

      # 部品表は公開する版へ添えるものであり、範囲に紐づかない。
      # どれか 1 つで書き出せば足りる。
      - name: 部品表を書き出す
        if: matrix.scope == 'checks'
        run: |
          docker compose run --rm -T web bin/rails officeweave:sbom > officeweave-sbom.json
          # 読める JSON であることと、対象と部品が入っていることを確かめる。
          ruby -rjson -e '
            document = JSON.parse(File.read("officeweave-sbom.json"))
            abort "形式が違う" unless document["bomFormat"] == "CycloneDX"
            abort "対象が無い" if document.dig("metadata", "component", "name").to_s.empty?
            abort "部品が無い" if document["components"].to_a.empty?
            puts "部品表: #{document["components"].size} 件"
          '

      - name: 部品表を成果物として残す
        if: matrix.scope == 'checks'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: officeweave-sbom
          path: officeweave-sbom.json
          retention-days: 30

      - name: 失敗した場合の記録を出す
        if: failure()
        run: docker compose logs

      - name: 後片付け
        if: always()
        run: docker compose down -v
