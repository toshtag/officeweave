name: 検証

# 手元と同じ手順を実行する。
# 検証の内容は bin/verify に定義してあり、ここでは呼び出すだけにする。
# 手順をここへ書き写すと、手元と自動実行で結果が食い違う。
#
# 速く返すため、範囲を分けて同時に走らせる。渡すのは範囲の名前だけとし、
# どのコマンドを流すかは bin/verify が決める。
#
# ここに置くのは、変更を出すたびに走らせるものだけとする。判断は
# 「この変更で壊れ得るか」で行う。壊れ得ないものを毎回走らせると、
# 待ち時間だけが増え、やがて結果を見ずにマージする習慣がつく。
#
# 配布用の構成、バックアップ、永続キュー、実ブラウザー、イメージの脆弱性は
# operations.yml へ置く。いずれも起動と後片付けを含んで 2 分前後かかり、
# 見ているのは配布用の構成とホスト側の手順である。

on:
  push:
    branches: [main]
  pull_request:

# 同じ枝で続けて push した場合、古い実行を止める。
#
# 止めないと、寄稿者は自分が捨てた commit の結果を待つことになる。実行の
# 順番も保証されないため、古い方が後に終わって最後の結果として残り得る。
#
# main は止めない。そこへ入ったものは、どの commit も結果を残す必要がある。
concurrency:
  group: 検証-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compose:
    name: 構成の分離
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ソースを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 分離の条件を検査する
        run: script/check_compose_isolation

  checks:
    name: 書式とセキュリティ
    runs-on: ubuntu-latest
    # 実測は 40 秒前後。上限は行き詰まりを止めるためだけに置く。
    timeout-minutes: 10

    steps:
      # 配送の規約は commit の並びを見る。1 つだけ取ると、その並びが無い。
      - name: ソースを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # この範囲はデータベースへ触れない。実行環境を組み立てず、実行環境の
      # Ruby と依存だけを用意する。組み立てに 30 秒かかるところが 20 秒で済む。
      #
      # クライアントの系列を揃える条件（runtime_version_test）は、スキーマ
      # 定義の読み書きに掛かるものである。触れないこの範囲には及ばない。
      # テストは触れるため、あちらはコンテナのままとする。
      #
      # 版は .ruby-version、依存は Gemfile.lock から復元する。手元と揃わない
      # 余地は、どちらも正本が 1 つであるため小さい。
      - name: Ruby と依存を用意する
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      # 脆弱性の一覧を実行の間で持ち越す。取り直すと 20 秒から 27 秒かかる。
      #
      # 鍵は実行ごとに変え、直前のものを土台にする。同じ鍵では書き換えられず、
      # 最初に取得した内容が残り続ける。中身の更新は bin/verify が行う。
      - name: 脆弱性の一覧を持ち越す
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/ruby-advisory-db
          key: ruby-advisory-db-${{ github.run_id }}
          restore-keys: ruby-advisory-db-

      - name: 検証を実行する
        env:
          BUNDLER_AUDIT_DB: ${{ github.workspace }}/tmp/ruby-advisory-db
        run: bin/verify checks

      # 配送の規約は、変更を出すたびに見る。あとからまとめて直せない種類の
      # ものであり、履歴へ入ってしまえば書き換えずに消せない。
      #
      # 照合する語はリポジトリへ書かない。書けば、それ自体が持ち込んだことに
      # なる。秘密の値として渡し、無い場合はその照合だけを飛ばす。
      - name: 配送の規約を検査する
        env:
          RESTRICTED_REFERENCE_PATTERNS: ${{ secrets.RESTRICTED_REFERENCE_PATTERNS }}
        run: |
          range="origin/${{ github.base_ref || 'main' }}..HEAD"
          git fetch --quiet origin "${{ github.base_ref || 'main' }}"
          script/check_delivery_contract "$range"

      # 部品表は公開する版へ添えるものであり、範囲に紐づかない。
      # データベースへ触れないため、この仕事で書き出せる。
      - name: 部品表を書き出す
        run: |
          bin/rails officeweave:sbom > officeweave-sbom.json
          # 読める JSON であることと、対象と部品が入っていることを確かめる。
          ruby -rjson -e '
            document = JSON.parse(File.read("officeweave-sbom.json"))
            abort "形式が違う" unless document["bomFormat"] == "CycloneDX"
            abort "対象が無い" if document.dig("metadata", "component", "name").to_s.empty?
            abort "部品が無い" if document["components"].to_a.empty?
            puts "部品表: #{document["components"].size} 件"
          '

      - name: 部品表を成果物として残す
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: officeweave-sbom
          path: officeweave-sbom.json
          retention-days: 30

  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # 実測は 1 分 30 秒前後、層が無い状態でも 4 分に収まる。上限は行き詰まりを
    # 止めるためだけに置く。長く取ると、止まったときに寄稿者がその分だけ待つ。
    timeout-minutes: 10

    # 分けて同時に走らせる。ここに並べるのは範囲と分け方だけとし、手順は
    # 持たせない。手順を写すと、config/verify.rb へ検査を足しても自動実行が
    # それを流さない状態が黙って生まれる。
    #
    # 範囲と分け方がすべて挙がっていることは
    # test/configuration/verification_scope_test.rb が確かめる。
    strategy:
      # 1 つが落ちても残りを最後まで走らせる。落ちた組だけを見て直せる。
      fail-fast: false
      matrix:
        include:
          - { name: テスト 1/3, scope: tests, shard: 1/3 }
          - { name: テスト 2/3, scope: tests, shard: 2/3 }
          - { name: テスト 3/3, scope: tests, shard: 3/3 }

    # 同じホストで複数の検証が並行しうる。
    # 構成ファイルの name をそのまま使うと、互いのコンテナとボリュームを掴む。
    env:
      COMPOSE_PROJECT_NAME: officeweave_ci_${{ github.run_id }}_${{ strategy.job-index }}

    steps:
      - name: ソースを取得する
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 組み立ての道具を用意する
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 組み立てた層を実行の間で持ち越す。
      #
      # 依存の解決は、依存の定義が変わらなければ毎回同じ結果になる。
      # 実行のたびにやり直すと、その待ち時間が変更を出した人へそのまま乗る。
      #
      # 名前は compose が使うものへそろえる。食い違うと、この手順で組み立てた
      # ものが使われず、compose が改めて組み立て直す。
      - name: 実行環境を組み立てる
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.COMPOSE_PROJECT_NAME }}:development
          load: true
          cache-from: type=gha,scope=development
          # 書き出すのは 1 つだけとする。分けた組がすべて書き出すと、同じ
          # 内容を組の数だけ送ることになり、その分だけ組み立てが伸びる。
          cache-to: ${{ matrix.shard == '1/3' && 'type=gha,scope=development,mode=max' || '' }}

      - name: データベースを起動する
        run: docker compose up -d db

      - name: 検証を実行する
        env:
          SCOPE: ${{ matrix.scope }}
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          docker compose run --rm -e TEST_SHARD web bin/verify "${SCOPE}"

      - name: 失敗した場合の記録を出す
        if: failure()
        run: docker compose logs

      - name: 後片付け
        if: always()
        run: docker compose down -v
